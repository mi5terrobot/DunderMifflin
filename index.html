
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Swipe Fenster</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.swipe-container {
  display: flex;
  width: 100%;
  height: 100vh;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none;
}

.swipe-container::-webkit-scrollbar {
  display: none;
}

.page {
  flex: 0 0 100%;
  height: 100%;
  scroll-snap-align: start;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  font-size: 28px;
  color: white;
}

.page:nth-child(1) {
  background: #3498db;
}

.page:nth-child(2) {
  background: #27ae60;
}

.page:nth-child(3) {
  background: #8e44ad;
}
</style>
</head>

<body>

<div class="swipe-container">

  <div class="page">
    <h2>Seite 1</h2>
    <p>Nach links wischen →</p>
  </div>

  <div class="page">
    <h2>Seite 2</h2>
    <p>Weiter wischen →</p>
  </div>

  <div class="page">
    <h2>Seite 3</h2>
    <p>Fertig!</p>
  </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swipe Fenster</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .beispiel {
      width: 100%;
      max-width: 600px;
      height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    .beispiel>div {
      border: 1px solid red;
      padding: 30px 0;
      flex: 0 0 auto;
    }

    .swipe-container {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
    }

    .swipe-container::-webkit-scrollbar {
      display: none;
    }

    .page {
      flex: 0 0 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      scroll-snap-align: start;
      font-size: 28px;
      color: white;
    }

    .page:nth-child(1) {
      background: #3498db;
    }

    .page:nth-child(2) {
      background: #27ae60;
    }

    .page:nth-child(3) {
      background: #8e44ad;
    }
  </style>
</head>

<body>
  <section class="beispiel" id="nullstellen-bestimmen">
    <div class="titel">Nullstellen bestimmen</div>
    <div class="aufgabe">Bestimme die Nullstellen von f mit f(x)=x+1.</div>

    <div class="swipe-container">
      <div class="page">
        <h2>Seite 1</h2>
        <p>Nach links wischen →</p>
      </div>
      <div class="page">
        <h2>Seite 2</h2>
        <p>Weiter wischen →</p>
      </div>
      <div class="page">
        <h2>Seite 3</h2>
        <p>Fertig!</p>
      </div>
    </div>

    <div class="navigation">Navigation</div>
  </section>
</body>

</html>
